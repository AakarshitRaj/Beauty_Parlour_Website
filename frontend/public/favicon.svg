<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>

    <!-- Metallic Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8D3C5"/>
      <stop offset="25%" stop-color="#EAA68F"/>
      <stop offset="50%" stop-color="#B86B7D"/>
      <stop offset="75%" stop-color="#EAA68F"/>
      <stop offset="100%" stop-color="#F8D3C5"/>
    </linearGradient>

    <!-- Soft Glow Accent -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAA68F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EAA68F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EAA68F" stop-opacity="0"/>
    </linearGradient>

    <style>
      .brand-title {
        font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
        font-weight: 600;
        font-size: 52px;
        letter-spacing: 10px;
        fill: url(#roseGold);
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica', sans-serif;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 12px;
        fill: #F8D3C5;
        text-transform: uppercase;
      }
      .established {
        font-family: 'Montserrat', 'Helvetica', sans-serif;
        font-weight: 300;
        font-size: 10px;
        letter-spacing: 4px;
        fill: #EAA68F;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Outer Circular Badge Container -->
  <g transform="translate(300, 300)">
    <!-- Outer Decorative Rings -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="url(#roseGold)" stroke-width="4"/>
    <circle cx="0" cy="0" r="248" fill="none" stroke="url(#roseGold)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="236" fill="none" stroke="url(#roseGold)" stroke-width="1" opacity="0.4"/>

    <!-- Inner Dark Core Circle -->
    <circle cx="0" cy="0" r="230" fill="#0C0D12"/>

    <!-- Girl Portrait Vector Silhouette -->
    <g transform="translate(0, -95) scale(1.15)">
      <!-- Face & Neck Profile -->
      <path d="M 0,-45 C 12,-45 22,-35 25,-20 C 27,-10 22,0 25,10 C 27,18 34,22 32,32 C 30,40 22,42 18,50 C 14,58 12,70 5,80 C -2,78 -8,70 -10,60 C -12,48 -5,40 -8,30 C -12,20 -22,18 -20,5 C -18,-8 -12,-15 -10,-28 C -8,-38 -8,-45 0,-45 Z" fill="url(#roseGold)"/>
      
      <!-- Flowing Hair Details -->
      <path d="M -10,-28 C -25,-25 -45,-10 -50,15 C -55,40 -40,65 -45,90 C -48,105 -60,115 -52,125 C -42,115 -35,95 -32,80 C -28,60 -38,40 -30,20 C -25,5 -15,-18 -10,-28 Z" fill="url(#roseGold)" opacity="0.9"/>
      <path d="M -2, -45 C -20,-40 -32,-25 -38,-5 C -42,15 -32,35 -36,55 C -40,75 -50,85 -42,100 C -34,85 -26,70 -28,50 C -30,30 -22,10 -15,-10 C -10,-25 -5,-38 -2,-45 Z" fill="url(#roseGold)" opacity="0.75"/>
      
      <!-- Flower Hair Accessory -->
      <path d="M -12,-18 C -16,-22 -22,-20 -24,-15 C -20,-12 -18,-6 -12,-10 C -6,-6 -4,-12 0,-15 C -4,-20 -8,-22 -12,-18 Z" fill="#FFF"/>
      <circle cx="-12" cy="-15" r="2" fill="#0C0D12"/>
    </g>

    <!-- Brand Name -->
    <text x="5" y="75" text-anchor="middle" class="brand-title">ARPAN</text>

    <!-- Divider Ribbon Line -->
    <path d="M -140,95 L 140,95" stroke="url(#glow)" stroke-width="1.5"/>
    <polygon points="0,90 5,95 0,100 -5,95" fill="url(#roseGold)"/>

    <!-- Category Tagline -->
    <text x="6" y="125" text-anchor="middle" class="brand-subtitle">BEAUTY PARLOUR</text>

    <!-- Sub-Text -->
    <text x="2" y="155" text-anchor="middle" class="established">PREMIUM SERVICES</text>
  </g>
</svg>
